name: Build CPAMP quota integration

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: seakee/CPA-Manager-Plus
          ref: dbf61ddf438f399558722df3467355c42af9005d
          path: cpamp
      - name: Apply integration patch
        working-directory: cpamp
        run: git apply ../plugin/integrations/cpamp/devin-openai-quota.patch
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: cpamp
          file: cpamp/Dockerfile.manager-server
          platforms: linux/amd64
          push: true
          tags: ghcr.io/pomoai-ai/cpamp-devin-openai:sha-${{ github.sha }}
          build-args: |
            VERSION=1.14.5-devin-openai.2
            SOURCE_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/PomoAi-ai/cliproxyapi-plugin-devin-openai
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=1.14.5-devin-openai.2
            org.opencontainers.image.licenses=MIT
      - name: Record immutable image
        run: echo 'ghcr.io/pomoai-ai/cpamp-devin-openai@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Export image for deployment
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          image="ghcr.io/pomoai-ai/cpamp-devin-openai@$IMAGE_DIGEST"
          docker pull --platform linux/amd64 "$image"
          image_id="$(docker image inspect "$image" --format '{{.Id}}')"
          docker tag "$image_id" cpamp-devin-openai:ci-export
          docker save cpamp-devin-openai:ci-export -o cpamp-image.tar
          printf '%s\n' "$image_id" > image-id.txt
          printf '%s\n' "$image" > registry-reference.txt
          sha256sum cpamp-image.tar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cpamp-image-linux-amd64
          path: |
            cpamp-image.tar
            image-id.txt
            registry-reference.txt
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7
